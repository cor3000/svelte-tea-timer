<!doctype html>
<html lang="en">
	<head>
		<title>TeaTime</title>
		<meta charset="utf-8" />
		<meta name="description" content="A beautiful Tea Timer App" />
		<meta name="viewport" content="width=device-width" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="Tea Time" />
		<link rel="icon" sizes="192x192" href="/img/teatime_5.png" />
		<link rel="apple-touch-icon" href="/img/teatime_5.png" />
		<meta name="theme-color" content="#333333" />
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function () {
					navigator.serviceWorker.register('/sw.js').then(
						function (registration) {
							console.log(
								'ServiceWorker registration successful with scope: ',
								registration.scope
							);
						},
						function (err) {
							console.log('ServiceWorker registration failed: ', err);
						}
					);
				});
			}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<noscript>Sorry, no JS ... no TeaTime.</noscript>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
